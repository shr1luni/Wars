---
- name: Deploy Youtube App
  hosts: all
  become: yes
  tasks:
    - name: Install Docker
      apt:
        name: docker.io
        state: present
        update_cache: yes

    - name: Start Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Install Docker Compose
      apt:
        name: docker-compose
        state: present

    - name: Copy docker-compose file
      copy:
        src: ../docker-compose.yml
        dest: /home/vagrant/docker-compose.yml

    - name: Deploy application
      command: docker-compose up -d
      args:
        chdir: /home/vagrant
